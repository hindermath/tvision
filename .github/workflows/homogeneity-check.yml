name: Homogeneity Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

# DE: Nur lesender Checkout; unbenannte Token-Rechte bleiben gesperrt.
# EN: Read-only checkout; unspecified token permissions remain disabled.
permissions:
  contents: read

jobs:
  homogeneity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run homogeneity check
        run: bash scripts/check-homogeneity.sh --dry-run --no-patch --json .
        env:
          CONSTITUTION_VERSION: "v1.20.2"
